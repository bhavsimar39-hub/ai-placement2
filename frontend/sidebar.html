<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • AI Placement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --primary-light: #D1FAE5;
            --accent: #6366F1;
            --accent-light: #EEF2FF;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --bg-lighter: #F3F4F6;
            --text-dark: #111827;
            --text-gray: #4B5563;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: "Plus Jakarta Sans", "Inter", -apple-system, sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ── ANIMATED BACKGROUND ── */
        .animated-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .gradient-mesh {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            animation: subtleFloat 25s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.85; transform: scale(1.02); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.08;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .orb1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #10B981, transparent);
            top: -20%; left: -15%;
        }

        .orb2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #6366F1, transparent);
            bottom: -20%; right: -15%;
            animation-delay: 7s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(30px, -30px) scale(1.05); }
        }

        .micro-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.5;
        }

        /* ── WRAPPER ── */
        .signup-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        /* ── LOGO ── */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            text-decoration: none;
        }

        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .logo-tagline {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* ── CARD ── */
        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, #10B981, #6366F1, #F59E0B);
        }

        /* ── HEADER ── */
        .signup-header {
            margin-bottom: 36px;
        }

        .signup-header h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .signup-header p {
            font-size: 15px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: var(--bg-white);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            font-family: "Plus Jakarta Sans", sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            background: var(--bg-white);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        /* ── PASSWORD STRENGTH ── */
        .password-strength {
            margin-top: 10px;
            display: none;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .strength-seg {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: var(--bg-lighter);
            transition: background 0.3s ease;
        }

        .strength-seg.weak   { background: #EF4444; }
        .strength-seg.fair   { background: #F59E0B; }
        .strength-seg.good   { background: #10B981; }
        .strength-seg.strong { background: #6366F1; }

        .strength-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-gray);
        }

        /* ── BUTTON ── */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            margin-top: 8px;
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 20px;
        }

        /* ── LOGIN LINK ── */
        .login-text {
            text-align: center;
            font-size: 15px;
            color: var(--text-gray);
        }

        .login-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .login-text a:hover {
            color: var(--primary-dark);
        }

        /* ── SUCCESS STATE ── */
        .success-section {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-section.active {
            display: block;
        }

        .success-icon-wrap {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.08));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }

        .success-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .success-sub {
            font-size: 15px;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .signup-card {
                padding: 36px 28px;
            }

            .signup-header h1 {
                font-size: 26px;
            }

            .logo-text {
                font-size: 26px;
            }
        }

        /* ── MOBILE ── */
        @media (max-width: 430px) {
            body {
                padding: 16px 12px;
                align-items: flex-start;
                padding-top: 24px;
            }
            .signup-wrapper {
                max-width: 100%;
            }
            .logo-section {
                margin-bottom: 24px;
            }
            .logo-text {
                font-size: 22px;
            }
            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .logo-tagline {
                font-size: 13px;
            }
            .signup-card {
                padding: 28px 20px;
                border-radius: 18px;
            }
            .signup-header {
                margin-bottom: 20px;
            }
            .signup-header h1 {
                font-size: 22px;
            }
            .signup-header p {
                font-size: 13px;
            }
        }

        /* ═══════════════════════════════════════════════
           POLISH: Background · Card · Inputs · Micro-UX
           ═══════════════════════════════════════════════ */
        #cursor-orb {
            position: fixed; pointer-events: none; z-index: 9998;
            width: 56px; height: 56px; border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.38) 0%, transparent 70%);
            transform: translate(-50%,-50%);
            transition: left 0.07s linear, top 0.07s linear;
            filter: blur(14px); mix-blend-mode: multiply;
        }
        #constellation-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .morph-blob {
            position: fixed; z-index: 0; pointer-events: none;
            width: 520px; height: 520px; top: 50%; left: 50%;
            transform: translate(-50%,-50%); opacity: 0.035;
            background: linear-gradient(135deg, #10B981 0%, #6366F1 100%);
            animation: blobMorph 14s ease-in-out infinite;
        }
        @keyframes blobMorph {
            0%,100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            25%      { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            50%      { border-radius: 50% 60% 30% 60% / 40% 50% 60% 50%; }
            75%      { border-radius: 40% 60% 60% 40% / 60% 40% 60% 40%; }
        }
        .aurora-layer {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(125deg,
                rgba(16,185,129,0.045) 0%, rgba(99,102,241,0.035) 40%,
                rgba(245,158,11,0.025) 80%, rgba(16,185,129,0.035) 100%);
            background-size: 400% 400%;
            animation: auroraShift 20s ease-in-out infinite;
        }
        @keyframes auroraShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .signup-card::before {
            background: linear-gradient(90deg,
                #10B981,#34D399,#6366F1,#A78BFA,#F59E0B,#10B981) !important;
            background-size: 400% 100% !important;
            animation: rainbowShift 5s linear infinite !important;
            height: 3px !important;
        }
        @keyframes rainbowShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        .signup-card { transform-style: preserve-3d; will-change: transform; }
        .input-wrap {
            position: relative; display: flex; align-items: center;
        }
        .input-icon {
            position: absolute; left: 15px; font-size: 15px;
            z-index: 2; pointer-events: none; line-height: 1;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        .input-wrap:focus-within .input-icon { transform: scale(1.18) rotate(-6deg); }
        .input-wrap .form-input { padding-left: 44px; padding-right: 46px; width: 100%; }
        .input-check {
            position: absolute; right: 14px; font-size: 14px; font-weight: 800;
            color: #10B981; opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
            transform: scale(0.4);
        }
        .input-check.show { opacity: 1; transform: scale(1); }
        .eye-btn {
            position: absolute; right: 12px; background: none; border: none;
            cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px;
            line-height: 1; z-index: 3; opacity: 0.55; transition: transform 0.2s, opacity 0.2s;
        }
        .eye-btn:hover { transform: scale(1.15); opacity: 1; }
        .caps-warn {
            display: none; margin-top: 7px; font-size: 12px; font-weight: 600;
            color: #D97706; padding: 5px 11px; border-radius: 7px;
            background: rgba(245,158,11,0.09); border: 1px solid rgba(245,158,11,0.22);
            align-items: center; gap: 5px;
        }
        .caps-warn.show { display: flex; }
        .form-input.valid   { border-color: #10B981 !important; animation: flashValid 0.4s ease; }
        .form-input.invalid { border-color: #EF4444 !important; }
        @keyframes flashValid {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            50%  { box-shadow: 0 0 0 7px rgba(16,185,129,0.08); }
            100% { box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        }
        .input-wrap:focus-within .form-input {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.13), 0 0 22px rgba(16,185,129,0.08) !important;
        }
        .char-counter {
            font-size: 11px; color: var(--text-light); text-align: right;
            margin-top: 5px; font-weight: 600; letter-spacing: 0.3px;
        }
        .char-counter.warn { color: #F59E0B; }
        .char-counter.over { color: #EF4444; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            15%      { transform: translateX(-10px); }
            30%      { transform: translateX(10px); }
            45%      { transform: translateX(-7px); }
            60%      { transform: translateX(7px); }
            75%      { transform: translateX(-3px); }
            90%      { transform: translateX(3px); }
        }
        .shake { animation: shake 0.55s cubic-bezier(.36,.07,.19,.97) both; }
        .btn-spinner {
            display: inline-block; width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: btnSpin .6s linear infinite;
            margin-right: 9px; vertical-align: middle;
        }
        @keyframes btnSpin { to { transform: rotate(360deg); } }
        .btn-primary { overflow: hidden !important; position: relative !important; }
        .ripple-fx {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.28); transform: scale(0);
            animation: rippleFx 0.55s linear; pointer-events: none;
        }
        @keyframes rippleFx { to { transform: scale(4.5); opacity: 0; } }
        .type-ripple {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            border: 1.5px solid rgba(16,185,129,0.22);
            transform: translate(-50%,-50%);
            animation: typeRippleFx 0.85s ease-out forwards;
        }
        @keyframes typeRippleFx {
            0%   { width: 0; height: 0; opacity: 0.65; }
            100% { width: 170px; height: 170px; opacity: 0; }
        }
    </style>
<script src="/config.js"></script>
</head>

<body>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-mesh"></div>
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="micro-grid"></div>
    </div>

    <div class="signup-wrapper">

        <!-- Logo -->
        <div class="logo-section">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                <span class="logo-text">AI Placement</span>
            </div>
            <p class="logo-tagline">Your intelligent career companion</p>
        </div>

        <!-- Card -->
        <div class="signup-card">

            <!-- Default: Sign Up Form -->
            <div id="signupForm">
                <div class="signup-header">
                    <h1>Create Account</h1>
                    <p>Start your journey to the perfect job</p>
                </div>

                <form onsubmit="return false;">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <div class="input-wrap">
                            <span class="input-icon">👤</span>
                            <input type="text" id="name" class="form-input" placeholder="John Doe" required maxlength="50" oninput="updateCharCount(this)">
                        </div>
                        <div class="char-counter" id="nameCounter">0 / 50</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                            <span class="input-check" id="emailCheckIcon">✓</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" class="form-input" placeholder="Create a strong password" oninput="checkStrength(this.value)" required>
                        </div>
                        <div class="caps-warn" id="capsWarnMain">⚠️ Caps Lock is on</div>
                        <div class="password-strength" id="strengthWrap">
                            <div class="strength-bar">
                                <div class="strength-seg" id="seg1"></div>
                                <div class="strength-seg" id="seg2"></div>
                                <div class="strength-seg" id="seg3"></div>
                                <div class="strength-seg" id="seg4"></div>
                            </div>
                            <span class="strength-label" id="strengthLabel"></span>
                        </div>
                    </div>

                    <button class="btn-primary" id="signupBtn" onclick="signup()">
                        Create Account
                    </button>
                </form>

                <div class="divider"><span>or</span></div>

                <p class="login-text">Already have an account? <a href="login.html">Sign in</a></p>
            </div>

            <!-- Success State -->
            <div class="success-section" id="successSection">
                <div class="success-icon-wrap">🎉</div>
                <p class="success-sub">Welcome aboard! Check your email for a confirmation link, then sign in to start your journey.</p>
                <button class="btn-primary" onclick="window.location.href='/login.html'">
                    Go to Sign In →
                </button>
            </div>

        </div>
    </div>

    <script>
        // ── Password Strength ──────────────────────────────────
        function checkStrength(val) {
            const wrap = document.getElementById('strengthWrap');
            const label = document.getElementById('strengthLabel');
            const segs  = [1,2,3,4].map(i => document.getElementById('seg'+i));

            if (!val) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';

            let score = 0;
            if (val.length >= 8)          score++;
            if (/[A-Z]/.test(val))        score++;
            if (/[0-9]/.test(val))        score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { cls: 'weak',   text: 'Weak',   color: '#EF4444' },
                { cls: 'fair',   text: 'Fair',   color: '#F59E0B' },
                { cls: 'good',   text: 'Good',   color: '#10B981' },
                { cls: 'strong', text: 'Strong', color: '#6366F1' },
            ];

            segs.forEach((s, i) => {
                s.className = 'strength-seg';
                if (i < score) s.classList.add(levels[score - 1].cls);
            });

            const lv = levels[score - 1] || levels[0];
            label.textContent = lv.text;
            label.style.color = lv.color;
        }

        // ── Signup ─────────────────────────────────────────────
        async function signup() {
            const name     = document.getElementById("name").value.trim();
            const email    = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const btn      = document.getElementById("signupBtn");

            if (!name || !email || !password) {
                alert("All fields are required!");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span>Creating Account…';

            try {
                const res  = await fetch(API + "/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById("signupForm").style.display    = "none";
                    document.getElementById("successSection").classList.add("active");
                } else {
                    alert(data.message || "Signup failed. Please try again.");
                    btn.disabled    = false;
                    btn.textContent = "Create Account";
                }

            } catch (err) {
                alert("Error connecting to server: " + err.message);
                btn.disabled    = false;
                btn.textContent = "Create Account";
            }
        }

        // Enter key on password field
        document.getElementById("password").addEventListener("keypress", (e) => {
            if (e.key === "Enter") signup();
        });

        // ── Character counter ──
        function updateCharCount(input) {
            var counter = document.getElementById('nameCounter');
            if (!counter) return;
            var len = input.value.length;
            counter.textContent = len + ' / 50';
            counter.className = 'char-counter' + (len >= 50 ? ' over' : len >= 35 ? ' warn' : '');
        }
    </script>
<script src="/polish.js"></script>
<script>
(function() {
    var orb = document.createElement('div'); orb.id = 'cursor-orb'; document.body.appendChild(orb);
    document.addEventListener('mousemove', function(e) { orb.style.left = e.clientX+'px'; orb.style.top = e.clientY+'px'; });

    var canvas = document.createElement('canvas'); canvas.id = 'constellation-canvas'; document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);
    var dots = []; for (var i=0;i<55;i++) dots.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.8+.8});
    var mouse = {x:canvas.width/2,y:canvas.height/2};
    document.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(var i=0;i<dots.length;i++){var d=dots[i];d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>canvas.width)d.vx*=-1;if(d.y<0||d.y>canvas.height)d.vy*=-1;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='rgba(16,185,129,.45)';ctx.fill();for(var j=i+1;j<dots.length;j++){var dx=d.x-dots[j].x,dy=d.y-dots[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<115){ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(dots[j].x,dots[j].y);ctx.strokeStyle='rgba(16,185,129,'+(0.14*(1-dist/115))+')';ctx.lineWidth=.5;ctx.stroke();}}var mdx=d.x-mouse.x,mdy=d.y-mouse.y,md=Math.sqrt(mdx*mdx+mdy*mdy);if(md<140){ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(mouse.x,mouse.y);ctx.strokeStyle='rgba(99,102,241,'+(0.22*(1-md/140))+')';ctx.lineWidth=.7;ctx.stroke();}}requestAnimationFrame(draw);}
    draw();

    var aurora=document.createElement('div');aurora.className='aurora-layer';document.body.appendChild(aurora);
    var blob=document.createElement('div');blob.className='morph-blob';document.body.insertBefore(blob,document.body.firstChild);

    var card=document.querySelector('.signup-card');
    if(card){card.addEventListener('mousemove',function(e){var r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform='perspective(1000px) rotateY('+(x*7)+'deg) rotateX('+(-y*7)+'deg) scale(1.012)';card.style.boxShadow=(-x*18)+'px '+(-y*18)+'px 60px rgba(0,0,0,.11),0 24px 64px rgba(0,0,0,.08)';});card.addEventListener('mouseleave',function(){card.style.transform='';card.style.boxShadow='';});}

    document.addEventListener('keydown',function(e){var f=document.activeElement;if(!f||!f.classList.contains('form-input'))return;var r=f.getBoundingClientRect(),rip=document.createElement('div');rip.className='type-ripple';rip.style.left=(r.left+r.width/2)+'px';rip.style.top=(r.top+r.height/2)+'px';document.body.appendChild(rip);setTimeout(function(){if(rip.parentNode)rip.parentNode.removeChild(rip);},900);});

    document.querySelectorAll('.btn-primary').forEach(function(btn){btn.addEventListener('click',function(e){var r=btn.getBoundingClientRect(),el=document.createElement('span');el.className='ripple-fx';var s=Math.max(r.width,r.height);el.style.width=el.style.height=s+'px';el.style.left=(e.clientX-r.left-s/2)+'px';el.style.top=(e.clientY-r.top-s/2)+'px';btn.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},600);});});

    var pw=document.getElementById('password'),pww=pw&&pw.closest('.input-wrap');
    if(pww){var eye=document.createElement('button');eye.type='button';eye.className='eye-btn';eye.innerHTML='👁';eye.addEventListener('click',function(){pw.type=pw.type==='password'?'text':'password';eye.innerHTML=pw.type==='password'?'👁':'🙈';});pww.appendChild(eye);}
    if(pw){pw.addEventListener('keyup',function(e){var w=document.getElementById('capsWarnMain');if(w)w.classList.toggle('show',e.getModifierState&&e.getModifierState('CapsLock'));});}

    var ei=document.getElementById('email'),ec=document.getElementById('emailCheckIcon');
    if(ei){ei.addEventListener('input',function(){var v=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ei.value);ei.classList.toggle('valid',v);ei.classList.toggle('invalid',ei.value.length>0&&!v);if(ec)ec.classList.toggle('show',v);});}

    var origSignup=window.signup;
    if(origSignup){window.signup=async function(){var n=document.getElementById('name').value.trim(),em=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!n||!em||!p||p.length<6){var c=document.querySelector('.signup-card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}}return origSignup.apply(this,arguments);};}

    setTimeout(function(){var f=document.getElementById('name');if(f)f.focus();},350);
})();
</script>
</body>
</html>
