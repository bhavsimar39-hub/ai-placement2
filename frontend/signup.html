<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • AI Placement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --primary-light: #D1FAE5;
            --accent: #6366F1;
            --accent-light: #EEF2FF;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --bg-lighter: #F3F4F6;
            --text-dark: #111827;
            --text-gray: #4B5563;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: "Plus Jakarta Sans", "Inter", -apple-system, sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ── ANIMATED BACKGROUND ── */
        .animated-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .gradient-mesh {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            animation: subtleFloat 25s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.85; transform: scale(1.02); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.08;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .orb1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #10B981, transparent);
            top: -20%; left: -15%;
        }

        .orb2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #6366F1, transparent);
            bottom: -20%; right: -15%;
            animation-delay: 7s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(30px, -30px) scale(1.05); }
        }

        .micro-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.5;
        }

        /* ── WRAPPER ── */
        .signup-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        /* ── LOGO ── */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            text-decoration: none;
        }

        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .logo-tagline {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* ── CARD ── */
        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, #10B981, #6366F1, #F59E0B);
        }

        /* ── HEADER ── */
        .signup-header {
            margin-bottom: 36px;
        }

        .signup-header h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .signup-header p {
            font-size: 15px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: var(--bg-white);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            font-family: "Plus Jakarta Sans", sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            background: var(--bg-white);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        /* ── PASSWORD STRENGTH ── */
        .password-strength {
            margin-top: 10px;
            display: none;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .strength-seg {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: var(--bg-lighter);
            transition: background 0.3s ease;
        }

        .strength-seg.weak   { background: #EF4444; }
        .strength-seg.fair   { background: #F59E0B; }
        .strength-seg.good   { background: #10B981; }
        .strength-seg.strong { background: #6366F1; }

        .strength-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-gray);
        }

        /* ── BUTTON ── */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            margin-top: 8px;
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 20px;
        }

        /* ── LOGIN LINK ── */
        .login-text {
            text-align: center;
            font-size: 15px;
            color: var(--text-gray);
        }

        .login-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .login-text a:hover {
            color: var(--primary-dark);
        }

        /* ── SUCCESS STATE ── */
        .success-section {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-section.active {
            display: block;
        }

        .success-icon-wrap {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.08));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }

        .success-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .success-sub {
            font-size: 15px;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .signup-card {
                padding: 36px 28px;
            }

            .signup-header h1 {
                font-size: 26px;
            }

            .logo-text {
                font-size: 26px;
            }
        }

        /* ── MOBILE ── */
        @media (max-width: 430px) {
            body {
                padding: 16px 12px;
                align-items: flex-start;
                padding-top: 24px;
            }
            .signup-wrapper {
                max-width: 100%;
            }
            .logo-section {
                margin-bottom: 24px;
            }
            .logo-text {
                font-size: 22px;
            }
            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .logo-tagline {
                font-size: 13px;
            }
            .signup-card {
                padding: 28px 20px;
                border-radius: 18px;
            }
            .signup-header {
                margin-bottom: 20px;
            }
            .signup-header h1 {
                font-size: 22px;
            }
            .signup-header p {
                font-size: 13px;
            }
        }
    </style>
<script src="/config.js"></script>
</head>

<body>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-mesh"></div>
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="micro-grid"></div>
    </div>

    <div class="signup-wrapper">

        <!-- Logo -->
        <div class="logo-section">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                <span class="logo-text">AI Placement</span>
            </div>
            <p class="logo-tagline">Your intelligent career companion</p>
        </div>

        <!-- Card -->
        <div class="signup-card">

            <!-- Default: Sign Up Form -->
            <div id="signupForm">
                <div class="signup-header">
                    <h1>Create Account</h1>
                    <p>Start your journey to the perfect job</p>
                </div>

                <form onsubmit="return false;">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Create a strong password" oninput="checkStrength(this.value)" required>
                        <div class="password-strength" id="strengthWrap">
                            <div class="strength-bar">
                                <div class="strength-seg" id="seg1"></div>
                                <div class="strength-seg" id="seg2"></div>
                                <div class="strength-seg" id="seg3"></div>
                                <div class="strength-seg" id="seg4"></div>
                            </div>
                            <span class="strength-label" id="strengthLabel"></span>
                        </div>
                    </div>

                    <button class="btn-primary" id="signupBtn" onclick="signup()">
                        Create Account
                    </button>
                </form>

                <div class="divider"><span>or</span></div>

                <p class="login-text">Already have an account? <a href="/login">Sign in</a></p>
            </div>

            <!-- Success State -->
            <div class="success-section" id="successSection">
                <div class="success-icon-wrap">🎉</div>
                <div class="success-title">Account Created!</div>
                <p class="success-sub">Welcome aboard! Check your email for a confirmation link, then sign in to start your journey.</p>
                <button class="btn-primary" onclick="window.location.href='/login'">
                    Go to Sign In →
                </button>
            </div>

        </div>
    </div>

    <script>
        // ── Password Strength ──────────────────────────────────
        function checkStrength(val) {
            const wrap = document.getElementById('strengthWrap');
            const label = document.getElementById('strengthLabel');
            const segs  = [1,2,3,4].map(i => document.getElementById('seg'+i));

            if (!val) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';

            let score = 0;
            if (val.length >= 8)          score++;
            if (/[A-Z]/.test(val))        score++;
            if (/[0-9]/.test(val))        score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { cls: 'weak',   text: 'Weak',   color: '#EF4444' },
                { cls: 'fair',   text: 'Fair',   color: '#F59E0B' },
                { cls: 'good',   text: 'Good',   color: '#10B981' },
                { cls: 'strong', text: 'Strong', color: '#6366F1' },
            ];

            segs.forEach((s, i) => {
                s.className = 'strength-seg';
                if (i < score) s.classList.add(levels[score - 1].cls);
            });

            const lv = levels[score - 1] || levels[0];
            label.textContent = lv.text;
            label.style.color = lv.color;
        }

        // ── Signup ─────────────────────────────────────────────
        async function signup() {
            const name     = document.getElementById("name").value.trim();
            const email    = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const btn      = document.getElementById("signupBtn");

            if (!name || !email || !password) {
                alert("All fields are required!");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            btn.disabled    = true;
            btn.textContent = "Creating Account…";

            try {
                const res  = await fetch(API + "/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById("signupForm").style.display    = "none";
                    document.getElementById("successSection").classList.add("active");
                } else {
                    alert(data.message || "Signup failed. Please try again.");
                    btn.disabled    = false;
                    btn.textContent = "Create Account";
                }

            } catch (err) {
                alert("Error connecting to server: " + err.message);
                btn.disabled    = false;
                btn.textContent = "Create Account";
            }
        }

        // Enter key on password field
        document.getElementById("password").addEventListener("keypress", (e) => {
            if (e.key === "Enter") signup();
        });
    </script>
</body>
</html>
