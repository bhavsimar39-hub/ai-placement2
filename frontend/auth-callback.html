<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in... • AI Placement</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 52px; height: 52px;
            border: 4px solid rgba(16,185,129,0.15);
            border-top-color: #10B981;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 8px; }
        p  { font-size: 14px; color: #6B7280; }
        .error {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 12px;
            padding: 16px 20px;
            color: #DC2626;
            font-size: 14px;
            margin-top: 20px;
            display: none;
        }

        /* ── MOBILE ── */
        @media (max-width: 480px) {
            .wrap { padding: 24px 20px; }
            .spinner { width: 40px; height: 40px; margin-bottom: 18px; }
            h2 { font-size: 18px; }
            p  { font-size: 13px; }
            .error { font-size: 13px; padding: 12px 16px; border-radius: 10px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="spinner"></div>
    <h2>Signing you in...</h2>
    <p>Please wait while we complete your Google login.</p>
    <div class="error" id="errMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function() {
    // ── Same Supabase client ──
    const _supabase = supabase.createClient(
        'https://tbbjseuniixtofxnglgn.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiYmpzZXVuaWl4dG9meG5nbGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0ODM2NTQsImV4cCI6MjA4OTA1OTY1NH0.W105azTILfUkD0Ufu0weV_uZFxlbOIdxJtJeLlyTSYQ'
    );

    try {
        // Get session from the URL hash that Supabase appended after Google redirect
        const { data: { session }, error } = await _supabase.auth.getSession();

        if (error || !session) {
            throw new Error(error?.message || 'No session found');
        }

        const token        = session.access_token;
        const refreshToken = session.refresh_token;
        const userName     = session.user.user_metadata?.full_name
                          || session.user.user_metadata?.name
                          || session.user.email.split('@')[0];

        // Store exactly like your normal login does
        localStorage.setItem('token', token);
        localStorage.setItem('refreshToken', refreshToken);
        localStorage.setItem('userName', userName);

        // Redirect to dashboard
        window.location.href = '/dashboard';

    } catch (err) {
        const errEl = document.getElementById('errMsg');
        errEl.style.display = 'block';
        errEl.textContent = 'Login failed: ' + err.message + '. Redirecting to login...';
        setTimeout(() => { window.location.href = '/login'; }, 3000);
    }
})();
</script>
</body>
</html>
