<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password • AI Placement</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#10B981;--bg:#0F1419;--card:#1A1F26;--t1:#F9FAFB;--t2:#9CA3AF;--border:rgba(16,185,129,.15)}
body{font-family:"Archivo",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}.bg{position:fixed;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12}
.orb1{width:500px;height:500px;background:radial-gradient(circle,#10B981,transparent);top:-20%;left:-15%}
.orb2{width:450px;height:450px;background:radial-gradient(circle,#6366F1,transparent);bottom:-20%;right:-15%}
.wrap{position:relative;z-index:1;width:100%;max-width:440px}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:36px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#10B981,#059669);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(16,185,129,.3)}
.logo-text{font-size:26px;font-weight:800;font-family:"JetBrains Mono",monospace;background:linear-gradient(135deg,#10B981,#6366F1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 44px;box-shadow:0 24px 64px rgba(0,0,0,.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#10B981,#6366F1,#F59E0B)}
.state{display:none;animation:fadeUp .4s ease}
.state.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid rgba(16,185,129,.15);border-top-color:#10B981;animation:spin .7s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.tc{text-align:center}
.state-icon{font-size:44px;margin-bottom:18px}
.state-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.state-sub{font-size:15px;color:var(--t2);line-height:1.6;margin-bottom:28px}
.form-group{margin-bottom:22px}
.form-label{display:block;font-size:14px;font-weight:600;color:var(--t1);margin-bottom:10px}
.form-input{width:100%;padding:15px 18px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;font-size:15px;color:var(--t1);font-family:"Archivo",sans-serif;outline:none;transition:all .25s}
.form-input:focus{background:rgba(255,255,255,.06);border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.form-input::placeholder{color:var(--t2)}
.strength-wrap{margin-top:10px;display:none}
.strength-bar{display:flex;gap:4px;margin-bottom:5px}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s}
.seg.weak{background:#EF4444}.seg.fair{background:#F59E0B}.seg.good{background:#10B981}.seg.strong{background:#6366F1}
.strength-label{font-size:12px;color:var(--t2)}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#fca5a5;margin-bottom:18px}
.err.show{display:block}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:"Archivo",sans-serif;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.btn-primary:hover{transform:translateY(-2px)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;padding:13px 32px;width:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--t2);border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;font-family:"Archivo",sans-serif;transition:all .2s}
.btn-sec:hover{color:var(--t1);background:rgba(255,255,255,.09)}
.success-icon{width:76px;height:76px;background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(16,185,129,.1));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 20px}

/* ── MOBILE ── */
@media(max-width:480px){
  body{padding:16px 12px;align-items:flex-start;padding-top:28px;}
  .wrap{max-width:100%;}
  .logo{margin-bottom:24px;gap:10px;}
  .logo-icon{width:38px;height:38px;font-size:20px;}
  .logo-text{font-size:22px;}
  .card{padding:28px 20px;border-radius:18px;}
  .state-title{font-size:22px;}
  .state-sub{font-size:13px;}
  .form-input{padding:13px 14px;font-size:14px;}
  .btn{padding:13px;font-size:15px;}
  .btn-sec{padding:11px 22px;font-size:14px;}
}
@media(max-width:360px){
  .card{padding:22px 14px;}
  .state-title{font-size:19px;}
}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🎯</div>
    <span class="logo-text">AI Placement</span>
  </div>
  <div class="card">

    <!-- LOADING -->
    <div class="state show" id="stateLoading">
      <div class="tc"><div class="spinner"></div>
        <div class="state-title">Verifying link…</div>
        <div class="state-sub">Please wait.</div>
      </div>
    </div>

    <!-- FORM -->
    <div class="state" id="stateForm">
      <div class="state-icon">🔐</div>
      <div class="state-title">Set New Password</div>
      <div class="state-sub">Choose a strong password.</div>
      <div class="err" id="errBanner"></div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-input" id="newPassword" placeholder="Minimum 6 characters" oninput="checkStrength(this.value)">
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-bar">
            <div class="seg" id="s1"></div><div class="seg" id="s2"></div>
            <div class="seg" id="s3"></div><div class="seg" id="s4"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="Repeat your new password">
      </div>
      <button class="btn btn-primary" id="resetBtn" onclick="doReset()">Reset Password</button>
    </div>

    <!-- SUCCESS -->
    <div class="state" id="stateSuccess">
      <div class="tc">
        <div class="success-icon">✅</div>
        <div class="state-title" style="color:#10B981">Password Updated!</div>
        <div class="state-sub">Redirecting to login…</div>
        <button class="btn-sec" onclick="window.location.href='/login.html?reset=success'">Go to Login →</button>
      </div>
    </div>

    <!-- EXPIRED -->
    <div class="state" id="stateInvalid">
      <div class="tc">
        <div class="state-icon">❌</div>
        <div class="state-title" style="color:#fb7185">Link Expired</div>
        <div class="state-sub">This link has expired or already been used.<br>Request a new one from the login page.</div>
        <button class="btn-sec" onclick="window.location.href='/login.html'">← Back to Login</button>
      </div>
    </div>

  </div>
</div>
<script>
const SUPA_URL  = "https://tbbjseuniixtofxnglgn.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiYmpzZXVuaWl4dG9meG5nbGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0ODM2NTQsImV4cCI6MjA4OTA1OTY1NH0.W105azTILfUkD0Ufu0weV_uZFxlbOIdxJtJeLlyTSYQ";

let sb; // supabase client

function show(id) {
    document.querySelectorAll(".state").forEach(s => s.classList.remove("show"));
    document.getElementById(id).classList.add("show");
}
function showErr(msg) {
    const b = document.getElementById("errBanner");
    b.textContent = "⚠️ " + msg;
    b.classList.add("show");
}

async function init() {
    // ── Parse BOTH hash (#) and query string (?) ─────────────────
    // Desktop email clients use #access_token=...
    // Mobile email clients often strip # and use ?code=... (PKCE)
    const hashParams  = new URLSearchParams(window.location.hash.substring(1));
    const queryParams = new URLSearchParams(window.location.search);

    // Check for error in either location
    const errCode = hashParams.get("error_code") || queryParams.get("error_code")
                 || hashParams.get("error")       || queryParams.get("error");
    if (errCode) { show("stateInvalid"); return; }

    const token   = hashParams.get("access_token")  || queryParams.get("access_token");
    const refresh = hashParams.get("refresh_token")  || queryParams.get("refresh_token");
    const code    = queryParams.get("code"); // PKCE flow (mobile)

    // Init Supabase client
    try {
        sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
    } catch(e) {
        show("stateInvalid");
        return;
    }

    try {
        if (code) {
            // ── PKCE flow (mobile) ─────────────────────────────
            // Exchange the code for a session
            const { data, error } = await sb.auth.exchangeCodeForSession(code);
            if (error || !data?.session) { show("stateInvalid"); return; }

        } else if (token) {
            // ── Implicit flow (desktop) ────────────────────────
            const { data, error } = await sb.auth.setSession({
                access_token:  token,
                refresh_token: refresh || token
            });
            if (error || !data?.session) { show("stateInvalid"); return; }

        } else {
            show("stateInvalid");
            return;
        }

        show("stateForm");
        document.getElementById("newPassword").focus();

    } catch(e) {
        show("stateInvalid");
    }
}

function checkStrength(val) {
    const wrap = document.getElementById("strengthWrap");
    const label = document.getElementById("strengthLabel");
    const segs = [1,2,3,4].map(i => document.getElementById("s"+i));
    if (!val) { wrap.style.display = "none"; return; }
    wrap.style.display = "block";
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const lvls = [{cls:"weak",text:"Weak",color:"#EF4444"},{cls:"fair",text:"Fair",color:"#F59E0B"},{cls:"good",text:"Good",color:"#10B981"},{cls:"strong",text:"Strong",color:"#6366F1"}];
    segs.forEach((s,i) => { s.className = "seg"; if (i < score) s.classList.add(lvls[score-1].cls); });
    const lv = lvls[score-1] || lvls[0];
    label.textContent = lv.text;
    label.style.color = lv.color;
}

async function doReset() {
    const newPwd  = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    const btn     = document.getElementById("resetBtn");

    if (newPwd.length < 6) { showErr("Password must be at least 6 characters."); return; }
    if (newPwd !== confirm) { showErr("Passwords don't match."); return; }

    btn.disabled = true;
    btn.textContent = "Updating…";

    const { error } = await sb.auth.updateUser({ password: newPwd });

    if (error) {
        showErr(error.message || "Failed. Please request a new reset link.");
        btn.disabled = false;
        btn.textContent = "Reset Password";
        return;
    }

    await sb.auth.signOut();
    localStorage.removeItem("token");
    show("stateSuccess");
    setTimeout(() => window.location.href = "/login.html?reset=success", 3000);
}

document.addEventListener("keypress", e => {
    if (e.key === "Enter" && document.getElementById("stateForm").classList.contains("show")) doReset();
});

// Run init after page loads
window.addEventListener("load", init);
</script>
</body>
</html>
